name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unna_brain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e ".[dev]"
      
      - name: Lint with ruff
        run: ruff check app tests
      
      - name: Type check with mypy
        run: mypy app --ignore-missing-imports
      
      - name: Run tests with pytest
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          AUTH_ENABLED: "false"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          R2_ENDPOINT_URL: "https://test.r2.cloudflarestorage.com"
          R2_ACCESS_KEY_ID: test_access_key
          R2_SECRET_ACCESS_KEY: test_secret_key
          R2_BUCKET_NAME: test-bucket
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml --tb=short
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend
          fail_ci_if_error: false
        if: always()
      
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln CVE-2024-23342 --ignore-vuln CVE-2025-2861
      
      - name: Build Docker image
        run: docker build -t unna-brain-api:${{ github.sha }} .
      
      - name: Test Docker container health
        run: |
          docker run -d --name test-container -p 8000:8000 unna-brain-api:${{ github.sha }}
          sleep 5
          docker logs test-container
          curl -f http://localhost:8000/api/v1/health || exit 1
          docker stop test-container && docker rm test-container
