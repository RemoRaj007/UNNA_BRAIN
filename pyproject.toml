[project]
name = "unna-brain-api"
version = "0.1.0"
description = "UNNA Brain enterprise backend scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "python-multipart>=0.0.9",
  "pandas>=2.2.2",
  "openpyxl>=3.1.5",
  "python-docx>=1.1.2",
  "aioboto3>=13.1.1",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.pytest.ini_options]
addopts = "--cov=app/services --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
