app = 'unna-brain'
primary_region = 'ams'

[build]

[env]
PORT = "8000"

[deploy]
release_command = "python -m alembic upgrade head"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 2048
